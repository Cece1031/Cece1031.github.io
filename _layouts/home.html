<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }}</title>
  <meta name="description" content="{{ site.description | escape }}">
  <meta name="theme-color" content="#ffffff">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title | escape }}">
  <meta property="og:description" content="{{ site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">
  {% if site.social_image %}
  <meta property="og:image" content="{{ site.social_image | absolute_url }}">
  <meta property="og:image:alt" content="Qingni Wang — Trustworthy AI and Uncertainty Quantification">
  <meta name="twitter:image" content="{{ site.social_image | absolute_url }}">
  {% endif %}
  <link rel="icon" href="{{ '/images/favicon.ico' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/home.css' | relative_url }}">
  <script src="{{ '/assets/js/home.js' | relative_url }}" defer></script>
</head>
<body id="top">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="wordmark" href="#top" aria-label="Qingni Wang, back to top">Qingni<span class="wordmark-dot">.</span></a>
      <nav aria-label="Main navigation">
        <a href="#about-me">About</a><a href="#publications">Research</a><a href="#news">News</a><a href="#beyond">Beyond research</a>
      </nav>
      <a class="header-contact" href="#contact">Let’s connect <span aria-hidden="true">↗</span></a>
    </div>
  </header>
  <main id="main" class="container">{{ content }}</main>
  <footer class="site-footer container">
    <span>© {{ 'now' | date: '%Y' }} Qingni Wang</span>
    <span>Made with curiosity & a little lavender.</span>
    <a href="#top">Back to top <span aria-hidden="true">↑</span></a>
  </footer>
</body>
</html>
