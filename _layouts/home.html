<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }}</title>
  <meta name="description" content="{{ site.description | escape }}">
  <meta id="theme-color-meta" name="theme-color" content="#ffffff">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title | escape }}">
  <meta property="og:description" content="{{ site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">
  {% if site.social_image %}
  <meta property="og:image" content="{{ site.social_image | absolute_url }}">
  <meta name="twitter:image" content="{{ site.social_image | absolute_url }}">
  {% endif %}
  <link rel="icon" href="{{ '/images/cat-favicon-v2.svg' | relative_url }}" type="image/svg+xml">
  <link rel="shortcut icon" href="{{ '/images/cat-favicon-v2.ico' | relative_url }}" type="image/x-icon">
  <link rel="apple-touch-icon" href="{{ '/images/cat-touch-v2.png' | relative_url }}">
  <link rel="manifest" href="{{ '/images/site.webmanifest' | relative_url }}?v=cat-2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <script>
    try {
      const savedTheme = localStorage.getItem('qingni-theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = savedTheme || (prefersDark ? 'dark' : 'light');
    } catch (error) {
      document.documentElement.dataset.theme = 'light';
    }
  </script>
  <link rel="stylesheet" href="{{ '/assets/css/home.css' | relative_url }}">
  <script src="{{ '/assets/js/theme.js' | relative_url }}" defer></script>
</head>
<body id="top">
  <a class="skip-link" href="#content">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="wordmark" href="#top">Qingni Wang<span>.</span></a>
      <nav aria-label="Main navigation">
        <a href="#about">About</a>
        <a href="#news">News</a>
        <a href="#publications">Publications</a>
        <a href="#service">Service</a>
      </nav>
      <button class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false" title="Switch to dark mode">
        <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.2 15.2A8.3 8.3 0 0 1 8.8 3.8 8.4 8.4 0 1 0 20.2 15.2Z"/>
        </svg>
        <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3.6"/>
          <path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6m12 12 1.4 1.4M2.5 12h2m15 0h2M4.6 19.4 6 18M18 6l1.4-1.4"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="page-shell">
    {{ content }}
  </main>

  <footer class="site-footer">
    <span>© {{ 'now' | date: '%Y' }} Qingni Wang</span>
    <span>Last updated {{ 'now' | date: '%B %Y' }}</span>
  </footer>
</body>
</html>
