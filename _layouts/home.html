<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }}</title>
  <meta name="description" content="{{ site.description | escape }}">
  <meta name="theme-color" content="#ffffff">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title | escape }}">
  <meta property="og:description" content="{{ site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">
  {% if site.social_image %}
  <meta property="og:image" content="{{ site.social_image | absolute_url }}">
  <meta name="twitter:image" content="{{ site.social_image | absolute_url }}">
  {% endif %}
  <link rel="icon" href="{{ '/images/favicon.svg' | relative_url }}?v=cat-1" type="image/svg+xml">
  <link rel="icon" href="{{ '/images/favicon.ico' | relative_url }}?v=cat-1" sizes="any">
  <link rel="apple-touch-icon" href="{{ '/images/apple-touch-icon.png' | relative_url }}?v=cat-1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/home.css' | relative_url }}">
</head>
<body id="top">
  <a class="skip-link" href="#content">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="wordmark" href="#top">Qingni Wang<span>.</span></a>
      <nav aria-label="Main navigation">
        <a href="#about">About</a>
        <a href="#news">News</a>
        <a href="#publications">Publications</a>
        <a href="#service">Service</a>
      </nav>
    </div>
  </header>

  <main class="page-shell">
    {{ content }}
  </main>

  <footer class="site-footer">
    <span>© {{ 'now' | date: '%Y' }} Qingni Wang</span>
    <span>Last updated {{ 'now' | date: '%B %Y' }}</span>
  </footer>
</body>
</html>
